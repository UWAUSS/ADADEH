<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Ulang Tahun!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=DotGothic16&display=swap">
<style>
:root{--ink:#3b2230;--cream:#fff3d6;--pink:#ff5c8a;--plum:#6fb3c8;--px:"Press Start 2P",ui-monospace,monospace;--vt:"VT323",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#bfe6f2;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ttl{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 4vh);margin:0;text-align:center;font:400 clamp(11px,3.2vw,24px)/1.7 var(--px);color:#fff;text-shadow:3px 3px 0 #3f8fb0;padding:0 12px}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cake{pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;width:min(30vmin,150px);transform:scale(var(--s,1));opacity:var(--o,1);transition:transform .14s steps(3),opacity .45s steps(4)}
#cake canvas{display:block;width:100%;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(40,90,120,.35))}
#cake.hit canvas{animation:wob .25s steps(4)}
#cake:focus-visible{outline:4px dashed #fff2c9;outline-offset:6px}
@keyframes wob{25%{rotate:-7deg}75%{rotate:7deg}}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;font:400 clamp(9px,2.4vw,12px)/2 var(--px);color:#fff;text-shadow:2px 2px 0 #2f6f8f}
#hearts i{display:inline-block;width:10px;height:10px;margin:0 3px;background:rgba(255,255,255,.6)}
#hearts i.on{background:var(--pink)}
#letter{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,90,120,.35);padding:16px}
#letter[hidden]{display:none}
.paper{width:min(520px,100%);max-height:84vh;overflow:auto;background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--plum);padding:22px 24px;font:400 clamp(20px,5vw,25px)/1.25 var(--vt);animation:rise .7s steps(8)}
@keyframes rise{from{transform:translateY(70px) scale(.3);opacity:0}}
.seal{width:16px;height:16px;background:#d6384b;margin:0 auto 14px;box-shadow:4px 0 0 #d6384b,-4px 0 0 #d6384b,0 4px 0 #d6384b,0 -4px 0 #d6384b}
.paper h2{font:400 13px/1.6 var(--px);margin:0 0 14px}
.paper p{margin:0 0 12px}
.sig{text-align:right;margin-top:16px}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btns button{font:400 10px/1.4 var(--px);background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;cursor:pointer}
.btns button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btns button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(28,18,48,.9)}
#intro[hidden]{display:none}
#intro.out{opacity:0;transition:opacity .4s steps(4);pointer-events:none}
.ibox{width:min(520px,100%);background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--plum);padding:26px 20px;text-align:center}
.ibox h2{font:400 clamp(13px,4.2vw,20px)/1.8 var(--px);margin:0 0 22px}
.ibtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.ibtns button{font:400 clamp(11px,3.2vw,14px)/1.4 var(--px);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 16px;cursor:pointer;touch-action:manipulation}
.ibtns button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.ibtns button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
#yes{background:#2fb35a}
#no{background:#e5484d}
#no.fly{position:fixed;z-index:60;transition:left .12s steps(3),top .12s steps(3)}
#taunt{min-height:2.4em;margin:18px 0 0;font:400 clamp(9px,2.6vw,11px)/1.8 var(--px);color:#d6384b}
.stk{width:96px;image-rendering:pixelated;animation:jig 1.3s steps(2) infinite}
.stk.r{float:right;margin:2px 0 6px 12px}
.stk.l{float:left;margin:2px 12px 6px 0}
@keyframes jig{50%{transform:rotate(5deg) translateY(-3px)}}
.paper p::after{content:"";display:block;clear:both}
.paper p.tag{font:400 10px/1.9 var(--px);color:#d6384b;text-align:center}
@media (prefers-reduced-motion:reduce){.stk{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<h1 id="ttl"></h1>
<main id="stage"><button id="cake" aria-label="Kue ulang tahun. Tekan berkali-kali"><canvas id="ck" width="16" height="16"></canvas></button></main>
<p id="hint">Tekan kuenya!<br><span id="hearts"></span></p>
<section id="intro" role="dialog" aria-modal="true" aria-labelledby="iq">
  <div class="ibox">
    <h2 id="iq">Kakanya ulang tahun hari ini bukan?</h2>
    <div class="ibtns"><button id="yes">BETULLL!!</button><button id="no">BUKAAAN!!</button></div>
    <p id="taunt" aria-live="polite"></p>
  </div>
</section>
<section id="letter" hidden role="dialog" aria-modal="true" aria-labelledby="lt">
  <div class="paper">
    <div class="seal"></div>
    <h2 id="lt"></h2>
    <div id="body"></div>
    <p class="sig" id="sig"></p>
    <div class="btns"><button id="again">Tiup lagi</button><button id="close">Tutup</button></div>
  </div>
</section>
